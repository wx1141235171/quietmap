name: CREATEAPK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK 与 cmdline-tools；不用 android-actions/setup-android
      # （该 action 会去装已被官方仓库移除的旧 tools 包，在新镜像上随机失败）。
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK_ROOT" ] || { echo "::error::Android SDK 不存在: $SDK_ROOT"; exit 1; }
          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || { echo "::error::找不到 sdkmanager: $SDKM"; exit 1; }

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

          # 平台包名带小版本号（android-37.0）时优先，缺失则回退到 android-37
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" "platforms;android-37" "build-tools;37.0.0"

      # AGP 的 compileSdk 37 会解析为 platforms/android-37，而仓库里的平台包
      # 安装目录可能是 platforms/android-37.0，缺 android-37 时补一个符号链接。
      # 只改 CI 的 SDK 目录，不动仓库。
      - name: Link platforms/android-37
        run: |
          set -euo pipefail
          if [ ! -e "$SDK_ROOT/platforms/android-37" ] \
             && [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
            echo "Created: android-37 -> android-37.0"
          fi
          echo "--- platforms ---"
          ls -1 "$SDK_ROOT/platforms"
          echo "--- build-tools ---"
          ls -1 "$SDK_ROOT/build-tools"

      # 不配置任何签名密钥：release 走无签名分支，产出 quietmap-<version>-unsigned.apk
      - name: Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
                    :app:jacocoTestReport \
                    :app:lintDebug \
                    :app:assembleDebug \
                    :app:assembleRelease \
                    --stacktrace --console=plain

      # verify-apk.sh 检查 Xposed 元数据 / scope / 入口 / R8 keep / Manifest / 版本号；
      # 未签名时自动跳过证书校验（见脚本 --require-signature）。
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit || true)"
          [ -n "$APK" ] || { echo "::error::没有找到 release APK"; find app/build/outputs -name '*.apk' || true; exit 1; }
          echo "校验: $APK"
          bash tools/verify-apk.sh "$APK" --out-dir build-artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            build-artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test / lint / coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/tests
            app/build/reports/lint-results*
            app/build/reports/jacoco
          if-no-files-found: warn
          retention-days: 14
